name: Feature request
description: Suggest something Arsenale should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: It keeps Arsenale an observer (it does not need Arsenale to start or control agents)
        - label: It works without a network connection and without new dependencies
